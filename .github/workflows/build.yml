name: build

# Produces the two artifacts an ordinary person downloads:
#   Windows  PFN-Setup-<version>.exe  (installer, needs Inno Setup on the runner)
#            PFN-<version>-win64.zip   (portable folder, just PFN.exe inside)
#   macOS    PFN-<version>.dmg        (drag to Applications)
#
# Nothing here runs on the user's machine: they only download the result.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Freeze application
        run: python -m PyInstaller pfn.spec --noconfirm --clean

      - name: Portable ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path backend\app\core\config.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Copy-Item README.md dist\PFN\README.md
          Compress-Archive -Path dist\PFN\* -DestinationPath "PFN-$version-win64.zip"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\pfn.iss" "/DAppVersion=$env:VERSION"

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem . -File | Where-Object { $_.Name -like "PFN-*" } | Sort-Object Name
          $files += Get-ChildItem release -File | Where-Object { $_.Name -like "PFN-*" } | Sort-Object Name
          $files | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            PFN-*-win64.zip
            release/PFN-*-Setup.exe
            SHA256SUMS.txt

  macos:
    # Отложено: .app/.dmg собираются только на Mac. Job оставлен рабочим, но не
    # запускается на каждый push, чтобы не краснеть без причины.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Make .icns from the shared PNG
        run: |
          mkdir -p assets/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out assets/icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out assets/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: Freeze application
        run: python -m PyInstaller pfn.spec --noconfirm --clean

      - name: DMG
        run: |
          version=$(grep -o 'APP_VERSION = "[^"]*"' backend/app/core/config.py | cut -d'"' -f2)
          hdiutil create -volname "PFN" -srcfolder "dist/PFN.app" -ov -format UDZO "PFN-$version.dmg"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: PFN-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*
            artifacts/macos/*
          generate_release_notes: true
